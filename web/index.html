<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonder</title>
    <meta
      name="description"
      content="Мини-соцсеть, доменное ядро которой исполняется шестнадцатибитной программой под DOS."
    />
    <link rel="stylesheet" href="/styles.css" />
    <!--
      Модуль, а не сборка. Сборщика в проекте нет: модули грузит сам
      браузер, и цена этому — несколько лишних запросов при первом
      заходе. Взамен нет ни одного шага между исходником и тем, что
      исполняется, а значит нечему и разойтись (ADR-0012).
    -->
    <script type="module" src="/build/app/main.js"></script>
  </head>
  <body>
    <!--
      Ссылка для клавиатуры. Первая в порядке обхода и видима только при
      фокусе: иначе до содержимого пришлось бы протабать всю шапку на
      каждой странице.
    -->
    <a class="skip" href="#содержимое">Перейти к содержимому</a>
    <div id="приложение"></div>
    <noscript>
      <p class="noscript">
        Sonder работает на сигналах и без JavaScript показать ленту не
        может. Это осознанное ограничение, а не недосмотр.
      </p>
    </noscript>
  </body>
</html>
