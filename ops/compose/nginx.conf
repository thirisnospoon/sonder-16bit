# Фронт и прокси к оболочке.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Заголовки безопасности. CSP запрещает всё, кроме своего: сторонних
  # скриптов у страницы нет по построению (ADR-0012), и разрешать их
  # значило бы держать открытой дверь, в которую никто не ходит.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    always;

  location /api/ {
    # Косая черта в конце адреса СРЕЗАЕТ совпавший префикс: `/api/feed`
    # уходит на бэкенд как `/feed`. Без неё запрос ушёл бы как
    # `/api/feed`, а такого маршрута у оболочки нет — контракт объявляет
    # `/api` базой публичного адреса (`servers`), а не частью пути.
    # Ошибка выглядит как «весь API отвечает 404».
    proxy_pass http://app:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Поток событий не буферизуется и не закрывается по сроку чтения:
    # буферизация превратила бы SSE в порционную выдачу раз в несколько
    # килобайт, а срок — в обрыв каждые шестьдесят секунд.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /actuator/ {
    # Здоровье наружу не отдаём: это внутренняя ручка, и подробности
    # состояния ноды посторонним знать незачем.
    return 404;
  }

  # Собранные модули меняются вместе с версией, но имён с отпечатком у
  # них нет: сборщика нет, а значит и переименовывать некому. Поэтому
  # кэш проверяется каждый раз — это честнее, чем отдавать устаревшее.
  location /build/ {
    add_header Cache-Control "no-cache" always;
  }

  # Всякий неизвестный адрес отдаёт index.html: маршрутизация на стороне
  # клиента, и переход по прямой ссылке обязан работать так же, как
  # переход внутри страницы.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
