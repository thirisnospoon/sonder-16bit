# Фронт и прокси к оболочке.

# Обычный HTTP только перенаправляет.
#
# Кука сессии объявлена контрактом как `Secure`, а `Secure` по HTTP
# браузер выбрасывает МОЛЧА: вход выглядел бы сломанным без единого
# сообщения. Оставить открытыми оба порта значит оставить дверь, за
# которой система не работает и не объясняет почему.
server {
  listen 80;
  server_name _;

  # Публичный адрес задан НАСТРОЙКОЙ, а не выведен из запроса, и это
  # не перестраховка. `$host` порта не содержит, а порт снаружи не
  # равен порту внутри: контейнер слушает 443, наружу он опубликован
  # как 8443. Перенаправление на `https://$host$request_uri` уводило
  # бы с рабочего порта на пустой, и выглядело бы это как «сайт не
  # открывается» — при полностью исправной системе.
  #
  # Подстановку делает сам образ nginx из шаблона; фильтр не пускает в
  # неё ничего, кроме наших переменных, — иначе envsubst съел бы и
  # `$host` с `$request_uri`.
  #
  # 301, а не 302: перенаправление постоянное по смыслу.
  return 301 ${SONDER_PUBLIC_ORIGIN}$request_uri;
}

server {
  # HTTP/2 включается вместе с TLS и не отдельно: браузеры незашифрованный
  # h2c не поддерживают. Он тут не роскошь — страница разложена на модули
  # ES без сборщика, и первый показ стоит двух десятков запросов.
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:4m;
  ssl_session_timeout 1h;

  # Заголовки безопасности. CSP запрещает всё, кроме своего: сторонних
  # скриптов у страницы нет по построению (ADR-0012), и разрешать их
  # значило бы держать открытой дверь, в которую никто не ходит.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    always;

  # СЖАТИЕ. Страница разложена на модули ES без сборщика, и по сети идёт
  # исходный текст: замер Lighthouse насчитал 68 КиБ, отдаваемых без
  # сжатия. Для текста это не оптимизация на полях, а разница между
  # одним пакетом и десятью — при том что gzip у nginx выключен по
  # умолчанию и включается одной строкой.
  #
  # `gzip_min_length` держит крошечные ответы несжатыми: заголовок gzip
  # и словарь на файле в двести байт обходятся дороже выигрыша.
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Явный robots.txt. Без него запрос попадал в общее правило и получал
  # index.html: разметку страницы, которую поисковый робот честно
  # пытался разобрать как правила обхода и насчитал в ней 35 ошибок.
  # Ответ HTML на запрос текстового файла — не мелочь: так же ведут
  # себя и все прочие несуществующие файлы.
  location = /robots.txt {
    # `default_type`, а не `add_header`: `return` со строкой ставит
    # Content-Type сам, и добавленный заголовок ушёл бы вторым — два
    # Content-Type в одном ответе.
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location /api/ {
    # ИМЯ РЕЗОЛВИТСЯ ЗАНОВО, А НЕ ОДИН РАЗ ПРИ СТАРТЕ.
    #
    # `proxy_pass http://app:8080/` с именем в адресе nginx разрешает
    # ОДНАЖДЫ, при чтении конфигурации, и запоминает единственный адрес.
    # Второй экземпляр оболочки после этого невидим: замерено — двадцать
    # запросов из двадцати ушли в первый. То есть масштабирование вширь
    # не давало ничего, даже по чтению, и выглядело это как «добавили
    # экземпляр, легче не стало».
    #
    # Резолвер — встроенный DNS Docker на 127.0.0.11. `valid=10s`
    # заставляет перечитывать запись: экземпляры приходят и уходят, а
    # десять секунд устаревания дешевле постоянных запросов к DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # Адрес через переменную — ровно то, что заставляет nginx резолвить
    # его при каждом запросе. С переменной пропадает срезание префикса
    # косой чертой, поэтому путь переписывается явно: `/api/feed` →
    # `/feed`. Контракт объявляет `/api` базой публичного адреса
    # (`servers`), а не частью пути; без переписывания весь API отвечал
    # бы 404.
    set $sonder_app app:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$sonder_app;

    # Экземпляр без линии к ядру отвечает на команды 502
    # DECIDER_UNAVAILABLE — честно, но клиенту от этого не легче.
    # Пробуем следующий: линия одна, и попасть на владеющий ею
    # экземпляр со второй попытки лучше, чем отдать отказ с первой.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # ОТКАЗ ШЛЮЗА — ТОЖЕ В КОНВЕРТЕ КОНТРАКТА.
    #
    # Оболочка научилась отвечать объявленным ApiError на всё, что до
    # неё дошло. Но пока она перезапускается, до неё не доходит НИЧЕГО:
    # отвечает nginx, и отвечает своей страницей на HTML. Клиент,
    # порождённый по OpenAPI, разбирает `{code, traceId}` и спотыкается
    # ровно в тот момент, когда объяснение нужнее всего.
    #
    # `$request_id` — идентификатор, который nginx заводит сам на
    # каждый запрос. Он не тот же, что `trace_id` оболочки: до неё
    # запрос не дошёл, и её следа не существует. Зато по нему запрос
    # находится в журнале самого nginx, а это всё, что тут есть.
    error_page 502 503 504 = @шлюз_отказал;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ПОТОК СОБЫТИЙ НЕ БУФЕРИЗУЕТСЯ и не закрывается по сроку чтения:
    # буферизация превратила бы SSE в порционную выдачу раз в несколько
    # килобайт, а срок — в обрыв каждые шестьдесят секунд.
    #
    # Эти три строки однажды уже уехали отсюда — вставка блока отказа
    # шлюза закрыла `location` раньше времени, и всё, что стояло ниже,
    # оказалось в новом блоке. Поток перестал открываться вовсе, а
    # `./sonder verify` остался зелёным: он не поднимает браузер.
    # Поймали браузерные сценарии, и это ровно то, ради чего они есть.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Блок отказа шлюза НИЧЕГО НЕ ПРОКСИРУЕТ: он отвечает строкой. Всякая
  # `proxy_*` здесь — след неудачной вставки, а не настройка.
  location @шлюз_отказал {
    default_type application/json;
    add_header X-Trace-Id "nginx-$request_id" always;
    return 502 '{"code":"GATEWAY_UNAVAILABLE","traceId":"nginx-$request_id"}';
  }

  location /actuator/ {
    # Здоровье наружу не отдаём: это внутренняя ручка, и подробности
    # состояния ноды посторонним знать незачем.
    return 404;
  }

  # Собранные модули меняются вместе с версией, но имён с отпечатком у
  # них нет: сборщика нет, а значит и переименовывать некому. Поэтому
  # кэш проверяется каждый раз — это честнее, чем отдавать устаревшее.
  location /build/ {
    add_header Cache-Control "no-cache" always;
  }

  # Всякий неизвестный адрес отдаёт index.html: маршрутизация на стороне
  # клиента, и переход по прямой ссылке обязан работать так же, как
  # переход внутри страницы.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
