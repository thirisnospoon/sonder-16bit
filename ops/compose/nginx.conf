# Фронт и прокси к оболочке.

# Обычный HTTP только перенаправляет.
#
# Кука сессии объявлена контрактом как `Secure`, а `Secure` по HTTP
# браузер выбрасывает МОЛЧА: вход выглядел бы сломанным без единого
# сообщения. Оставить открытыми оба порта значит оставить дверь, за
# которой система не работает и не объясняет почему.
server {
  listen 80;
  server_name _;

  # Публичный адрес задан НАСТРОЙКОЙ, а не выведен из запроса, и это
  # не перестраховка. `$host` порта не содержит, а порт снаружи не
  # равен порту внутри: контейнер слушает 443, наружу он опубликован
  # как 8443. Перенаправление на `https://$host$request_uri` уводило
  # бы с рабочего порта на пустой, и выглядело бы это как «сайт не
  # открывается» — при полностью исправной системе.
  #
  # Подстановку делает сам образ nginx из шаблона; фильтр не пускает в
  # неё ничего, кроме наших переменных, — иначе envsubst съел бы и
  # `$host` с `$request_uri`.
  #
  # 301, а не 302: перенаправление постоянное по смыслу.
  return 301 ${SONDER_PUBLIC_ORIGIN}$request_uri;
}

server {
  # HTTP/2 включается вместе с TLS и не отдельно: браузеры незашифрованный
  # h2c не поддерживают. Он тут не роскошь — страница разложена на модули
  # ES без сборщика, и первый показ стоит двух десятков запросов.
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:4m;
  ssl_session_timeout 1h;

  # Заголовки безопасности. CSP запрещает всё, кроме своего: сторонних
  # скриптов у страницы нет по построению (ADR-0012), и разрешать их
  # значило бы держать открытой дверь, в которую никто не ходит.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    always;

  # СЖАТИЕ. Страница разложена на модули ES без сборщика, и по сети идёт
  # исходный текст: замер Lighthouse насчитал 68 КиБ, отдаваемых без
  # сжатия. Для текста это не оптимизация на полях, а разница между
  # одним пакетом и десятью — при том что gzip у nginx выключен по
  # умолчанию и включается одной строкой.
  #
  # `gzip_min_length` держит крошечные ответы несжатыми: заголовок gzip
  # и словарь на файле в двести байт обходятся дороже выигрыша.
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Явный robots.txt. Без него запрос попадал в общее правило и получал
  # index.html: разметку страницы, которую поисковый робот честно
  # пытался разобрать как правила обхода и насчитал в ней 35 ошибок.
  # Ответ HTML на запрос текстового файла — не мелочь: так же ведут
  # себя и все прочие несуществующие файлы.
  location = /robots.txt {
    # `default_type`, а не `add_header`: `return` со строкой ставит
    # Content-Type сам, и добавленный заголовок ушёл бы вторым — два
    # Content-Type в одном ответе.
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
  }

  location /api/ {
    # Косая черта в конце адреса СРЕЗАЕТ совпавший префикс: `/api/feed`
    # уходит на бэкенд как `/feed`. Без неё запрос ушёл бы как
    # `/api/feed`, а такого маршрута у оболочки нет — контракт объявляет
    # `/api` базой публичного адреса (`servers`), а не частью пути.
    # Ошибка выглядит как «весь API отвечает 404».
    proxy_pass http://app:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Поток событий не буферизуется и не закрывается по сроку чтения:
    # буферизация превратила бы SSE в порционную выдачу раз в несколько
    # килобайт, а срок — в обрыв каждые шестьдесят секунд.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /actuator/ {
    # Здоровье наружу не отдаём: это внутренняя ручка, и подробности
    # состояния ноды посторонним знать незачем.
    return 404;
  }

  # Собранные модули меняются вместе с версией, но имён с отпечатком у
  # них нет: сборщика нет, а значит и переименовывать некому. Поэтому
  # кэш проверяется каждый раз — это честнее, чем отдавать устаревшее.
  location /build/ {
    add_header Cache-Control "no-cache" always;
  }

  # Всякий неизвестный адрес отдаёт index.html: маршрутизация на стороне
  # клиента, и переход по прямой ссылке обязан работать так же, как
  # переход внутри страницы.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
