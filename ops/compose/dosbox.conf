# DOSBox для NODE-7.
#
# @HOST@ и @PORT@ подставляет entrypoint: своих переменных окружения у
# DOSBox нет, а жёстко прописанный адрес запретил бы запускать образ
# где-либо, кроме этого compose.

[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[cpu]
# Максимум циклов: ядро считает решение микросекунды, а вот разбор
# конверта и опрос порта идут в том же цикле, и на медленной эмуляции
# линия становится узким местом раньше, чем ядро.
core=auto
cputype=auto
cycles=max

[serial]
# transparent:1 — без управляющих последовательностей нульмодема: кадры
# идут своим кадрированием с контрольной суммой, и второй слой поверх
# был бы лишним источником расхождений.
serial1=nullmodem server:@HOST@ port:@PORT@ transparent:1
serial2=disabled
serial3=disabled
serial4=disabled

[autoexec]
mount c /node
c:
NODE7.EXE > CON.TXT
exit
