# Сборщик метрик.
#
# Один источник: оболочка. Ни базы, ни ноды здесь нет, и это не
# недоделка — у Firebird нет экспортёра в составе, а НОДА НЕ УМЕЕТ HTTP
# ПО ПОСТРОЕНИЮ: она шестнадцатибитная и говорит только нульмодемом
# (ADR-0011). Её счётчики попадают сюда единственным возможным путём —
# оболочка спрашивает их пингом по линии и выкладывает своим
# показателем.
#
# Поэтому метрики ноды в этом сборщике имеют СВОЙСТВО, которого нет у
# обычных: они настолько свежи, насколько свеж последний опрос, и
# показывают -1, когда ответа нет вовсе. Ноль на их месте читался бы как
# «ноль команд, ноль ошибок» — то есть как исправная незанятая нода,
# что прямо противоположно истине.

global:
  # Пять секунд — по САМОМУ БЫСТРОМУ источнику, а не по самому медленному.
  # Время ответа HTTP меняется непрерывно, и собирать его раз в
  # пятнадцать секунд значит терять всё, что случилось между.
  #
  # Счётчики ноды при этом обновляются раз в 15 с (опрос по линии,
  # `sonder.decider.line.probe-ms`), и на графике они выглядят
  # ступеньками. Это не артефакт сбора, а свойство источника: чаще
  # спрашивать ядро незачем — каждый вопрос занимает линию, по которой
  # идут команды. Свежесть последнего ответа видна отдельным
  # показателем `sonder_node_probe_age_seconds`.
  scrape_interval: 5s
  scrape_timeout: 4s
  external_labels:
    stack: sonder-local

scrape_configs:
  - job_name: sonder-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
        labels:
          component: shell
