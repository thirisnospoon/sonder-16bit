# Источник данных Grafana, заданный файлом.
#
# Настройка руками через интерфейс живёт до первого `docker compose down
# -v` и не воспроизводится на другой машине. Гейт Ф10 требует, чтобы
# система поднималась на ЧИСТОЙ машине одной командой, а панель, которую
# после подъёма надо донастраивать мышью, этому требованию не отвечает.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
