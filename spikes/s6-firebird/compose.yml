# Firebird и клиент в одной сети — та же топология, в которой у CORBA
# ломался обратный вызов. События Firebird устроены так же: сервер
# соединяется с клиентом сам.
name: sonder-s6

services:
  db:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: sonder.fdb
      FIREBIRD_USE_LEGACY_AUTH: "true"
    networks: [sonder]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/firebird/data/sonder.fdb"]
      interval: 3s
      timeout: 3s
      retries: 30

  probe:
    build: .
    environment:
      FB_HOST: db
      FB_PORT: "3050"
      FB_DB: /var/lib/firebird/data/sonder.fdb
      FB_USER: sysdba
      FB_PASSWORD: masterkey
    depends_on:
      db:
        condition: service_healthy
    networks: [sonder]

networks:
  sonder:
