# Настройки оболочки.
#
# Адрес базы приходит извне и не имеет умолчания: умолчание вида
# localhost однажды сработает в неожиданном месте и запишет данные не
# туда. Пусто — приложение не поднимется, и это правильный исход.
spring:
  application:
    name: sonder-core
  datasource:
    url: ${SONDER_DB_URL:}
    username: ${SONDER_DB_USER:sysdba}
    password: ${SONDER_DB_PASSWORD:masterkey}
    driver-class-name: org.firebirdsql.jdbc.FBDriver
  jpa:
    # Схемой управляет Flyway, а не Hibernate. Автоматическое создание
    # таблиц по сущностям означало бы две схемы: одну в миграциях, другую
    # в аннотациях, и расходиться они начали бы молча.
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.FirebirdDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

sonder:
  decider:
    # Адрес гейтвея, за которым по последовательной линии живёт NODE-7.
    # Умолчания нет по той же причине, что и у базы: подставленный
    # localhost однажды пошлёт команды не туда. Пусто — ядра нет, и всякая
    # команда честно отвечает DECIDER_UNAVAILABLE.
    endpoint: ${SONDER_DECIDER_ENDPOINT:}
    # Сроки в миллисекундах. Взяты из замеров спайка S2, обоснование —
    # в DeciderConfig. Клиента без срока ответа не бывает: умолчание CXF
    # замерено и равно 60 000 мс — минута на залипшую команду.
    connect-timeout-ms: ${SONDER_DECIDER_CONNECT_MS:2000}
    receive-timeout-ms: ${SONDER_DECIDER_RECEIVE_MS:5000}

server:
  error:
    # Стек в ответе клиенту — подсказка тому, кто ищет способ сломать.
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
