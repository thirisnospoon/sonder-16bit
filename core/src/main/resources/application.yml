# Настройки оболочки.
#
# Адрес базы приходит извне и не имеет умолчания: умолчание вида
# localhost однажды сработает в неожиданном месте и запишет данные не
# туда. Пусто — приложение не поднимется, и это правильный исход.
spring:
  application:
    name: sonder-core
  datasource:
    url: ${SONDER_DB_URL:}
    username: ${SONDER_DB_USER:sysdba}
    password: ${SONDER_DB_PASSWORD:masterkey}
    driver-class-name: org.firebirdsql.jdbc.FBDriver
  jpa:
    # Схемой управляет Flyway, а не Hibernate. Автоматическое создание
    # таблиц по сущностям означало бы две схемы: одну в миграциях, другую
    # в аннотациях, и расходиться они начали бы молча.
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.FirebirdDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    # Отсутствие маршрута должно быть ИСКЛЮЧЕНИЕМ, а не тихим 404 от
    # контейнера: только тогда его видит обработчик и отвечает конвертом
    # из контракта. Без этой строки ответ уходил бы стандартной страницей
    # Spring с полями timestamp/status/error/path — формой, которой в
    # контракте нет.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # Статики у оболочки нет: её отдаёт nginx. Пока сопоставление
      # ресурсов включено, оно перехватывает всякий неизвестный адрес и
      # отвечает 404 само, не доводя дело до исключения выше.
      add-mappings: false

sonder:
  decider:
    # Адрес гейтвея, за которым по последовательной линии живёт NODE-7.
    # Умолчания нет по той же причине, что и у базы: подставленный
    # localhost однажды пошлёт команды не туда. Пусто — ядра нет, и всякая
    # команда честно отвечает DECIDER_UNAVAILABLE.
    endpoint: ${SONDER_DECIDER_ENDPOINT:}
    # Сроки в миллисекундах. Взяты из замеров спайка S2, обоснование —
    # в DeciderConfig. Клиента без срока ответа не бывает: умолчание CXF
    # замерено и равно 60 000 мс — минута на залипшую команду.
    connect-timeout-ms: ${SONDER_DECIDER_CONNECT_MS:2000}
    receive-timeout-ms: ${SONDER_DECIDER_RECEIVE_MS:5000}
    line:
      # Порт, на котором гейтвей ЖДЁТ ноду: нульмодем DOSBox приходит
      # клиентом, а сервер здесь. Пусто — линии нет вовсе, порт не
      # занимается, и ядро берётся по endpoint выше.
      #
      # Задать оба — линию и адрес — нельзя: приложение не поднимется.
      # Догадка о том, какое из двух ядер настоящее, стоила бы команд,
      # тихо уехавших не туда.
      port: ${SONDER_DECIDER_LINE_PORT:}
      # Срок команды в миллисекундах. Один и тот же для ждущего ответа и
      # для уборщика каналов — разойдись они, канал освобождался бы, пока
      # команда ещё ждёт, и ответ пришёл бы уже на чужой.
      timeout-ms: ${SONDER_DECIDER_LINE_TIMEOUT_MS:5000}
      # Опрос ноды: метрики берутся у неё же командой ping и попадают в
      # /actuator/health. Интервал считается от КОНЦА прошлого опроса —
      # нода отвечает не мгновенно, и опросы копились бы друг на друга,
      # занимая каналы, нужные командам.
      probe-ms: ${SONDER_DECIDER_LINE_PROBE_MS:15000}
      probe-initial-ms: ${SONDER_DECIDER_LINE_PROBE_INITIAL_MS:3000}
      # Через сколько снимок считать протухшим. Втрое больше периода:
      # один пропущенный опрос — ещё не беда, три подряд уже беда.
      # Протухший снимок полон и правдоподобен, и без этого срока
      # неотличим от свежего — то есть врёт ровно тогда, когда правда
      # нужнее всего.
      stale-ms: ${SONDER_DECIDER_LINE_STALE_MS:45000}
  session:
    # Кука сессии отдаётся только по HTTPS. Выключается ТОЛЬКО на
    # локальном подъёме по обычному HTTP: браузер иначе выбрасывает
    # куку молча, и вход не работает вовсе. Настройкой, а не догадкой по
    # схеме запроса: за прокси схема приходит заголовком, которому
    # верить нельзя.
    cookie-secure: ${SONDER_SESSION_COOKIE_SECURE:true}
    # Пусто — берётся срок жизни самой сессии. Кука, живущая дольше,
    # шлётся браузером после её смерти; короче — выкидывает раньше
    # времени.
    max-age-seconds: ${SONDER_SESSION_MAX_AGE:}

  outbox:
    # Фоновый дренаж очереди исходящих. Выключается целиком — например,
    # когда экземпляр обслуживает только чтение и разгребать очередь
    # должен другой.
    enabled: ${SONDER_OUTBOX_ENABLED:true}
    # Интервал между заходами, от КОНЦА прошлого. Задержка доставки
    # события ограничена им сверху: уведомление Firebird укоротит её, но
    # опрос остаётся основным путём — потерянное уведомление означало бы
    # навсегда застрявшее событие.
    poll-ms: ${SONDER_OUTBOX_POLL_MS:1000}
    # Первый заход не сразу: пусть приложение сначала поднимется.
    initial-delay-ms: ${SONDER_OUTBOX_INITIAL_MS:2000}
    batch: ${SONDER_OUTBOX_BATCH:32}
    # Сколько полных пачек разгребать за заход. Обоснование — в OutboxPump.
    max-rounds: ${SONDER_OUTBOX_MAX_ROUNDS:8}
    # Дверной звонок: просыпаться на POST_EVENT, а не только по часам.
    # Выключенный звонок замедляет систему, выключенный опрос её ломает —
    # поэтому выключать можно только этот.
    doorbell: ${SONDER_OUTBOX_DOORBELL:true}
    # Сторож застрявших событий. Проект не выкидывает ядовитое по порогу
    # — код, решающий по числу выбросить данные, теряет их молча, — и вся
    # работа сторожа в том, чтобы застрявшее было видно человеку.
    watch: ${SONDER_OUTBOX_WATCH:true}
    watch-ms: ${SONDER_OUTBOX_WATCH_MS:60000}
    # С какой попытки считать строку застрявшей. Обоснование — в OutboxWatch.
    stuck-attempts: ${SONDER_OUTBOX_STUCK:5}

management:
  endpoint:
    health:
      # ЖИВОСТЬ И ГОТОВНОСТЬ РАЗДЕЛЕНЫ, и это не украшение.
      #
      # Общее здоровье включает состояние ноды, а нода подключается к
      # линии САМА и только после того, как приложение поднялось. Свяжи
      # проверку живости с общим здоровьем — и получишь взаимную
      # блокировку: оркестратор ждёт здоровья, здоровье ждёт ноду, нода
      # ждёт поднявшееся приложение. В compose это выглядит как вечное
      # «health: starting».
      #
      # Живость отвечает на вопрос «процесс жив»; состояние ноды — это
      # готовность обслуживать команды, и его место в /actuator/health.
      probes:
        enabled: true
      # Подробности показываются всегда, и это безопасно: наружу
      # актуатор не выходит вовсе — nginx отдаёт на /actuator
      # четыреста четвёртую. Внутри же сети подробности и есть весь
      # смысл: без них видно только слово UP, а метрики ноды — то,
      # ради чего показатель написан, — не видно никак.
      show-details: always
  endpoints:
    web:
      exposure:
        # Наружу ручки всё равно не выходят: nginx отдаёт на /actuator
        # четыреста четвёртую. Здесь — то, чем пользуется оркестратор.
        include: health

server:
  error:
    # Стек в ответе клиенту — подсказка тому, кто ищет способ сломать.
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
  pattern:
    # Идентификатор трассировки В КАЖДОЙ строке, а не только там, где о
    # нём вспомнили. Строка лога без него бесполезна ровно тогда, когда
    # нужна: разбираются не с успешным запросом, а с одним конкретным
    # среди десятка в секунду. Пусто — значит строка написана вне
    # запроса (дренаж outbox, опрос ноды), и это тоже сведение.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{trace_id:-—}] %logger{28} : %msg%n"
