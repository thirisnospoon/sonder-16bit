# Sonder целиком.
#
#   docker compose up --build
#
# Четыре части, и порядок между ними важен по-настоящему:
#
#   db    Firebird 5 — состояние
#   app   оболочка на Java: HTTP наружу, линия к ноде внутрь
#   node  NODE-7 под DOSBox — доменное ядро, шестнадцать бит
#   web   статика и обратный прокси
#
# НОДА ПОДКЛЮЧАЕТСЯ САМА, и это не мелочь конфигурации. Нульмодем DOSBox
# — КЛИЕНТ: он идёт на порт оболочки, а не наоборот. Оболочка обязана
# слушать раньше, чем поднимется эмулятор, иначе тот придёт на закрытый
# порт, не дождётся и не повторит. `depends_on` этого не обеспечивает —
# он говорит лишь о том, что контейнер запущен, — поэтому нода ждёт порт
# сама, в своей точке входа.

name: sonder

services:
  db:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: ${SONDER_DB_PASSWORD:-masterkey}
      FIREBIRD_DATABASE: sonder.fdb
      # Устаревшая аутентификация: Jaybird 4 — последний, работающий на
      # восьмёрке (ADR-0004), и договориться с Srp он не умеет.
      FIREBIRD_USE_LEGACY_AUTH: "true"
    volumes:
      - db-data:/var/lib/firebird/data
    # ВОЗВРАЩАЕТСЯ САМА. Служба без политики перезапуска переживает
    # ровно до первого перезапуска демона Docker — а он случается:
    # обновление Docker Desktop, перезагрузка машины, нехватка памяти.
    # Наблюдалось прямо здесь: все контейнеры, включая чужих проектов,
    # показали одинаковый `Exited (255)` без единой записи об ошибке, и
    # вернулась только нода — единственная, у кого политика была.
    #
    # `unless-stopped`, а не `always`: остановленное руками остаётся
    # остановленным, иначе `docker compose stop` переставал бы работать.
    restart: unless-stopped
    healthcheck:
      # Готовность — по ФАЙЛУ базы, а не по открытому порту: порт
      # слушается раньше, чем база создана, и первое же подключение
      # тогда падает «файл не найден».
      test: ["CMD", "test", "-f", "/var/lib/firebird/data/sonder.fdb"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: ops/compose/Dockerfile.app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONDER_DB_URL: jdbc:firebirdsql://db:3050//var/lib/firebird/data/sonder.fdb?encoding=UTF8
      SONDER_DB_USER: sysdba
      SONDER_DB_PASSWORD: ${SONDER_DB_PASSWORD:-masterkey}
      # Линия, а не адрес: ядро настоящее и живёт за нульмодемом.
      # Задать заодно и SONDER_DECIDER_ENDPOINT нельзя — приложение
      # откажется подниматься, и это правильный исход.
      SONDER_DECIDER_LINE_PORT: "5077"
      SONDER_DECIDER_LINE_TIMEOUT_MS: "5000"
      # Кука с Secure — требование контракта, и здесь оно ВЫПОЛНЯЕТСЯ, а
      # не отложено: фронт стоит за TLS (самоподписанным, но настоящим).
      #
      # Раньше здесь было false, потому что состав ходил по обычному
      # HTTP: браузер выбрасывает Secure-куку молча, и вход выглядел бы
      # сломанным без единого сообщения. Настройка при этом объясняла,
      # чего проверка НЕ делает — путь, которым система пойдёт в бою, не
      # проверялся нигде.
      SONDER_SESSION_COOKIE_SECURE: "true"
    # Возвращается сама. Состояния у оболочки нет, а порядок при
    # восстановлении демон не соблюдает: она может подняться раньше базы,
    # упасть и подняться снова — и сойдётся сама. Это то же поведение,
    # что и в бою, где база и приложение перезапускаются независимо.
    restart: unless-stopped
    healthcheck:
      # ЖИВОСТЬ, а не общее здоровье. Общее включает состояние ноды, а
      # нода ждёт эту самую проверку, чтобы подключиться: вышла бы
      # взаимная блокировка, и выглядела бы она как вечное
      # «health: starting», без единого слова о причине.
      #
      # curl, а не /dev/tcp: CMD-SHELL идёт через /bin/sh, в этом образе
      # это dash, и /dev/tcp он не умеет — проверка молча не проходила
      # бы никогда.
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --output
        - /dev/null
        - http://127.0.0.1:8080/actuator/health/liveness
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s

  node:
    build:
      context: .
      dockerfile: ops/compose/Dockerfile.node
    depends_on:
      app:
        condition: service_healthy
    environment:
      SONDER_LINE_HOST: app
      SONDER_LINE_PORT: "5077"
    # Нода — единственная часть, чей перезапуск безопасен всегда: она без
    # состояния, а команды в работе оболочка роняет отказом сама.
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ops/compose/Dockerfile.web
    depends_on:
      app:
        condition: service_healthy
    # Возвращается сам. nginx без состояния, и его отсутствие означает
    # «сайт не открывается» — самый заметный из отказов и самый
    # бессмысленный, когда всё остальное работает.
    restart: unless-stopped
    environment:
      # Куда уводить пришедших по обычному HTTP. Порт снаружи не равен
      # порту внутри, и вывести его из запроса нельзя.
      SONDER_PUBLIC_ORIGIN: "https://localhost:${SONDER_WEB_TLS_PORT:-8443}"
      # Подставлять ТОЛЬКО наши переменные. Без фильтра envsubst
      # добрался бы и до `$host` с `$request_uri` и вычистил бы их:
      # переменных с такими именами в окружении нет, и на их месте
      # оказалась бы пустота.
      NGINX_ENVSUBST_FILTER: "SONDER_"
    ports:
      # Оба порта наружу: по обычному приходят те, кто набрал адрес
      # руками, и получают перенаправление. Закрыть его значило бы
      # встречать их отказом соединения вместо объяснения.
      - "${SONDER_WEB_PORT:-8080}:80"
      - "${SONDER_WEB_TLS_PORT:-8443}:443"

  # --- НАБЛЮДАЕМОСТЬ ------------------------------------------------
  #
  # Профилем `obs`, а не всегда. Дежурному она нужна, разработчику при
  # правке ленты — нет, а два лишних контейнера на каждый `up` означают
  # лишнюю память и лишние секунды на подъём. Гейт Ф10 требует, чтобы
  # ОДНОЙ командой поднималась рабочая система, и она поднимается;
  # панели — отдельная просьба:
  #
  #   docker compose --profile obs up -d
  #
  # Наружу они не выходят дальше localhost и без пароля: это локальный
  # состав, а не боевой. В бою и сборщик, и панель стоят за той же
  # аутентификацией, что и всё остальное.

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [obs]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./ops/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Двое суток: локальный состав держат поднятым день-два, а год
      # истории занял бы больше места, чем весь проект.
      - --storage.tsdb.retention.time=2d
    ports:
      - "${SONDER_PROM_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [obs]
    depends_on:
      - prometheus
    environment:
      # Вход без пароля — ОСОЗНАННО и только здесь. Пароль в файле
      # compose был бы паролем в версии, то есть хуже отсутствия: он
      # выглядит защитой и ею не является.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Открывается сразу на панели: искать её в списке из одной
      # позиции — работа, которой можно не быть.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/sonder.json
    volumes:
      - ./ops/compose/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./ops/compose/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./ops/compose/grafana/sonder.json:/etc/grafana/provisioning/dashboards/sonder.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${SONDER_GRAFANA_PORT:-3000}:3000"

volumes:
  db-data:
  prom-data:
  grafana-data:
