# Числовые границы домена.
#
# Источник правды. Из этого файла генерируются:
#   * Pascal — dosnode/src/generated/dmlimits.inc, где границы применяются;
#   * проверка соответствия OpenAPI: maxLength в описании веб-контракта
#     обязан совпадать, иначе клиент подскажет пользователю одно, а ядро
#     решит по другому.
#
# Границы живут здесь, а не в OpenAPI, потому что решает их ядро. В
# веб-контракте они присутствуют только как подсказка для интерфейса.

version: 1

limits:

  nick_min_len:
    value: 3
    description: "Минимальная длина ника"
    openapi_pattern: "^[a-z0-9_]{3,20}$"

  nick_max_len:
    value: 20
    description: "Максимальная длина ника"

  display_name_max_len:
    value: 60
    description: "Максимальная длина отображаемого имени"
    openapi: "RegisterRequest.displayName.maxLength"

  post_body_max_len:
    value: 1000
    description: "Максимальная длина тела поста"
    openapi: "CreatePostRequest.body.maxLength"

  comment_body_max_len:
    value: 500
    description: "Максимальная длина тела комментария"

  ban_reason_max_len:
    value: 200
    description: "Максимальная длина причины блокировки"
    openapi: "BanRequest.reason.maxLength"

  posts_per_hour:
    value: 20
    description: >
      Сколько постов один пользователь может создать за час. Считает
      оболочка и присылает счётчик в состоянии: у ядра нет ни базы,
      ни часов.

  comments_per_hour:
    value: 60
    description: "Сколько комментариев за час"
