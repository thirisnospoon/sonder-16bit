# Numeric limits of the domain.
#
# The source of truth. Generated from this file:
#   * Pascal -- dosnode/src/generated/dmlimits.inc, where the limits are
#     enforced;
#   * a conformance check against OpenAPI: maxLength in the web contract
#     must match, or the client hints one thing to the user and the core
#     refuses on another.
#
# The limits live here rather than in OpenAPI because the core decides
# them. In the web contract they appear only as a hint for the interface.

version: 1

limits:

  nick_min_len:
    value: 3
    description: "Shortest nick"
    openapi_pattern: "^[a-z0-9_]{3,20}$"

  nick_max_len:
    value: 20
    description: "Longest nick"

  display_name_max_len:
    value: 60
    description: "Longest display name"
    openapi: "RegisterRequest.displayName.maxLength"

  post_body_max_len:
    value: 1000
    description: "Longest post body"
    openapi: "CreatePostRequest.body.maxLength"

  comment_body_max_len:
    value: 500
    description: "Longest comment body"

  ban_reason_max_len:
    value: 200
    description: "Longest ban reason"
    openapi: "BanRequest.reason.maxLength"

  posts_per_hour:
    value: 20
    description: >
      How many posts one user may create in an hour. Counted by the
      shell and sent to the core in the actor context: the core has
      neither a database nor a clock.

  comments_per_hour:
    value: 60
    description: "How many comments in an hour"
