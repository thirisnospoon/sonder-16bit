# Каталог доменных событий.
#
# ЗАЧЕМ ОН ОТДЕЛЬНО ОТ WSDL. Событие порождает ядро, а потребляют его
# проекции, лента и SSE — то есть стороны, которые про WSDL не знают
# вовсе. В WSDL событие описано СТРУКТУРНО: тип строкой, поля списком пар
# «ключ-значение». Какие бывают типы и какие у каждого поля — там не
# сказано, и сказать нельзя: контракт вызова про это молчать обязан,
# иначе всякое новое событие ломало бы протокол.
#
# До этого файла типы событий жили строковыми литералами в dmdecide.pas и
# нигде больше. Схема базы ссылалась на «contracts/events» как на источник
# схемы полезной нагрузки, а каталог был пуст: обещание, которое некому
# было сдержать. Проекция, потребляющая события, сверяется теперь с этим
# перечнем, а не с памятью того, кто её писал.
#
# СВЕРЯЕТСЯ МЕХАНИЧЕСКИ. tools/validate-contracts/validate.py читает
# dmdecide.pas и требует, чтобы множество порождаемых там типов в
# точности совпало с перечнем ниже, а список полей каждого события — с
# тем, что ядро действительно кладёт. Событие, заведённое в ядре и не
# объявленное здесь, красит сборку; объявленное и не порождаемое — тоже.
#
# ИМЕНА В ПРОШЕДШЕМ ВРЕМЕНИ. Событие сообщает о том, что уже случилось, и
# отказаться от него нельзя. Повелительное наклонение («создать пост»)
# принадлежит команде, а команды ходят по WSDL.
#
# СОБЫТИЕ НЕСЁТ ИДЕНТИЧНОСТЬ, А НЕ КОПИЮ АГРЕГАТА. post.created не несёт
# тела поста, user.registered — отображаемого имени: и то и другое лежит
# в write-модели, в той же базе, и потребитель читает их оттуда. Копия в
# полезной нагрузке была бы вторым источником правды, который однажды
# разойдётся с первым. Поля события — это то, чего в write-модели по
# одному лишь идентификатору агрегата не найти: автор поста, цель
# подписки, тот, кто удалил.

version: 1

events:
  - type: user.registered
    aggregate: userId
    description: Пользователь заведён. Первое событие всякой учётной записи.
    fields:
      - name: nick
        description: Ник, по которому пользователя ищут и упоминают.

  - type: user.banned
    aggregate: targetUserId
    description: >
      Пользователь заблокирован модератором. Содержимое остаётся, но
      создавать новое он больше не может — это решает ядро, а не проекция.
    fields:
      - name: reason
        description: Причина, как её ввёл модератор.
      - name: bannedBy
        description: Кто заблокировал. Нужен для разбора спорных случаев.

  - type: post.created
    aggregate: postId
    description: >
      Пост создан. Разворачивается фанаутом в ленты подписчиков автора;
      тело и время берутся из write-модели, а не из полезной нагрузки —
      дублировать их здесь значило бы завести второй источник правды.
    fields:
      - name: authorId
        description: Автор поста. По нему ищутся подписчики при фанауте.

  - type: post.deleted
    aggregate: postId
    description: >
      Пост удалён. Из лент убирается; сама запись в write-модели остаётся
      со статусом DELETED, потому что удаление идемпотентно и должно
      отличаться от «поста никогда не было».
    fields:
      - name: deletedBy
        description: >
          Кто удалил. Автор и модератор — разные случаи, и по событию их
          надо различать.

  - type: comment.created
    aggregate: commentId
    description: Комментарий написан к посту.
    fields:
      - name: postId
        description: Пост, к которому написан комментарий.
      - name: authorId
        description: Автор комментария.

  - type: follow.created
    aggregate: followerId
    description: >
      Подписка заведена. Лента подписчика дополняется постами того, на
      кого подписались.
    fields:
      - name: targetUserId
        description: На кого подписались.

  - type: follow.removed
    aggregate: followerId
    description: >
      Подписка снята. Зеркало follow.created: из ленты убирается то, что
      она добавила.
    fields:
      - name: targetUserId
        description: От кого отписались.
