# Единый список кодов отказа.
#
# Источник правды. Из этого файла генерируются:
#   * Java  — enum sonder.contract.ErrorCode
#   * TS    — union ErrorCode для web
#   * Pascal — константы в src/generated/errcodes.inc
#
# Правила:
#   * код не переиспользуется и не меняет смысл — только добавляется новый;
#   * удаление кода — ломающее изменение контракта, новая мажорная версия;
#   * категория определяет статус HTTP и повторяемость по умолчанию;
#   * отдельный код может переопределить повторяемость своим полем
#     retryable — оно свойство кода, а не только категории;
#   * текст сообщения здесь не хранится: он живёт в локализации веба, а
#     оболочка и ядро оперируют только кодом.
#
# decided_by различает три вещи, а не две:
#
#   core          — код возвращает ФУНКЦИЯ РЕШЕНИЯ. На каждый такой код в
#                   golden-наборе tstdomn обязан быть случай, который его
#                   порождает; полнота покрытия проверяется механически.
#   core-runtime  — код порождает рантайм ядра: разбор конверта, падение
#                   файбера, мёртвая арена. Функции решения его не
#                   возвращают, и в golden-наборе ему делать нечего.
#   shell         — решает оболочка.
#
# Различие завели потому, что без него правило «на каждый код ядра есть
# случай» невозможно проверить: два инфраструктурных кода делали его
# заведомо ложным, и оно тихо не соблюдалось.

version: 1

categories:
  VALIDATION:  { http: 400, retryable: false, description: "Команда не проходит проверку формы" }
  AUTH:        { http: 401, retryable: false, description: "Не удалось установить личность" }
  PERMISSION:  { http: 403, retryable: false, description: "Личность установлена, но действие не разрешено" }
  NOT_FOUND:   { http: 404, retryable: false, description: "Объект не существует" }
  CONFLICT:    { http: 409, retryable: false, description: "Состояние не допускает этого действия" }
  RATE_LIMIT:  { http: 429, retryable: true,  description: "Превышено ограничение частоты" }
  UPSTREAM:    { http: 502, retryable: true,  description: "Отказала зависимость" }
  INTERNAL:    { http: 500, retryable: false, description: "Дефект системы" }

codes:

  # --- VALIDATION -----------------------------------------------------------
  - code: NICK_FORMAT_INVALID
    category: VALIDATION
    description: "Ник не соответствует [a-z0-9_]{3,20}"
    decided_by: core          # ядро на Pascal
  - code: POST_BODY_EMPTY
    category: VALIDATION
    description: "Тело поста пустое или состоит из пробельных символов"
    decided_by: core
  - code: POST_BODY_TOO_LONG
    category: VALIDATION
    description: "Тело поста длиннее допустимого"
    decided_by: core
  - code: COMMENT_BODY_EMPTY
    category: VALIDATION
    description: "Тело комментария пустое"
    decided_by: core
  - code: COMMENT_BODY_TOO_LONG
    category: VALIDATION
    description: "Тело комментария длиннее допустимого"
    decided_by: core
  - code: BAN_REASON_EMPTY
    category: VALIDATION
    description: "Причина блокировки обязательна: она попадает в аудит"
    decided_by: core
  - code: BAN_REASON_TOO_LONG
    category: VALIDATION
    description: "Причина блокировки длиннее допустимого"
    decided_by: core
  - code: DISPLAY_NAME_INVALID
    category: VALIDATION
    description: "Отображаемое имя пустое или длиннее допустимого"
    decided_by: core
  - code: TEXT_ENCODING_INVALID
    category: VALIDATION
    description: >-
      Свободный текст не является корректным UTF-8. Ядро считает длину в
      символах, а испорченную последовательность посчитать нельзя, поэтому
      отказ выносится раньше проверки длины. В норме недостижим: байты
      порождает Java, а линия защищена CRC-16.
    decided_by: core

  - code: MALFORMED_REQUEST
    category: VALIDATION
    description: >-
      Запрос не соответствует форме, объявленной в OpenAPI: нет тела,
      нет обязательного поля, поле не того типа.

      Решает оболочка, и это не пересечение с доменом: ядро проверяет
      СМЫСЛ команды — длину текста, права, частоту, — а здесь речь о том,
      что команду не удалось даже собрать. Отсутствующее тело запроса не
      «неверное отображаемое имя», и отвечать доменным кодом на него
      значило бы сказать пользователю неправду о том, что он сделал не так.
    decided_by: shell

  # --- AUTH -----------------------------------------------------------------
  # Аутентификация требует обращения к хранилищу и потому целиком в оболочке.
  - code: SESSION_INVALID
    category: AUTH
    description: "Сессия не найдена, истекла или отозвана"
    decided_by: shell
  - code: CREDENTIALS_INVALID
    category: AUTH
    description: "Неверная пара логин и пароль"
    decided_by: shell

  # --- PERMISSION -----------------------------------------------------------
  - code: ACTOR_BANNED
    category: PERMISSION
    description: "Заблокированный пользователь не создаёт содержимое"
    decided_by: core
  - code: NOT_OWNER
    category: PERMISSION
    description: "Действие доступно только владельцу объекта"
    decided_by: core
  - code: ROLE_INSUFFICIENT
    category: PERMISSION
    description: "Роль не даёт права на это действие"
    decided_by: core
  - code: CANNOT_MODERATE_PEER
    category: PERMISSION
    description: "Модератор не применяет меры к равному или старшему по роли"
    decided_by: core

  # --- NOT_FOUND ------------------------------------------------------------
  - code: USER_NOT_FOUND
    category: NOT_FOUND
    description: "Пользователь не существует"
    decided_by: core
  - code: POST_NOT_FOUND
    category: NOT_FOUND
    description: "Пост не существует"
    decided_by: core
  - code: RESOURCE_NOT_FOUND
    category: NOT_FOUND
    description: >-
      Запрошенного объекта нет или он не виден. Отдельный код, а не
      POST_NOT_FOUND, потому что это РАЗНЫЕ решения, принимаемые разными
      сторонами.

      POST_NOT_FOUND выносит ядро при обработке КОМАНДЫ: команда ссылается
      на пост, которого нет или который удалён, и это доменный отказ.

      RESOURCE_NOT_FOUND выносит оболочка при ЧТЕНИИ: ядро в чтении не
      участвует вовсе, читать — не решать. Смыслы у кодов уже разные
      (ядро отвечает POST_NOT_FOUND и на удалённый пост тоже), и один код
      на два решения означал бы, что изменение в ядре тихо поменяет
      поведение чтения.

      Различие нашёл гейт ArchUnit на первой же попытке оболочки
      воспользоваться чужим кодом.
    decided_by: shell

  # --- CONFLICT -------------------------------------------------------------
  - code: NICK_TAKEN
    category: CONFLICT
    description: "Ник уже занят"
    decided_by: core
  - code: SELF_FOLLOW
    category: CONFLICT
    description: "Нельзя подписаться на себя"
    decided_by: core
  - code: ALREADY_FOLLOWING
    category: CONFLICT
    description: "Подписка уже существует"
    decided_by: core
  - code: NOT_FOLLOWING
    category: CONFLICT
    description: >-
      Отписаться нельзя: подписки нет. Зеркало ALREADY_FOLLOWING, и
      появился код вместе с операцией UnfollowUser.

      Отписка от себя приходит сюда же, а не в SELF_FOLLOW: подписаться на
      себя нельзя, значит и подписки на себя не бывает, и «вы не подписаны»
      — точное описание, а не подмена.
    decided_by: core
  - code: ALREADY_BANNED
    category: CONFLICT
    description: "Пользователь уже заблокирован"
    decided_by: core
  - code: STATE_VERSION_CONFLICT
    category: CONFLICT
    description: "Состояние изменилось между загрузкой и сохранением, команду надо переиграть"
    decided_by: shell
    # Единственный код категории CONFLICT, который ПОВТОРЯЕМ, и потому
    # переопределяет умолчание категории.
    #
    # Остальные конфликты — «ваше действие противоречит реальности»:
    # ник занят, подписка уже есть, пользователь уже заблокирован. Повтор
    # там ничего не изменит и только потратит время.
    #
    # Конфликт версий устроен иначе: это проигранная гонка. Состояние
    # ушло вперёд, и следующая попытка с новым чтением и новым решением
    # ядра, скорее всего, пройдёт. Сказать клиенту «409, не повторяй»
    # значило бы посоветовать сдаться там, где нужно попробовать ещё раз.
    #
    # Нашёл это тест, который утверждал свойство, а не пересказывал код:
    # прогонщик команд сдаётся именно этим кодом, и повторяемость у него
    # обязана быть.
    retryable: true

  # --- RATE_LIMIT -----------------------------------------------------------
  - code: POST_RATE_EXCEEDED
    category: RATE_LIMIT
    description: "Превышено число постов за окно"
    decided_by: core
  - code: COMMENT_RATE_EXCEEDED
    category: RATE_LIMIT
    description: "Превышено число комментариев за окно"
    decided_by: core
  - code: LOGIN_RATE_EXCEEDED
    category: RATE_LIMIT
    description: "Слишком много попыток входа"
    decided_by: shell

  # --- UPSTREAM -------------------------------------------------------------
  - code: DECIDER_UNAVAILABLE
    category: UPSTREAM
    description: "Доменное ядро недоступно или не ответило в срок"
    decided_by: shell

  # --- INTERNAL -------------------------------------------------------------
  - code: INSUFFICIENT_CONTEXT
    category: INTERNAL
    description: >
      Ядру не хватило данных для решения: оболочка прислала не всё, что
      объявлено контрактом. Ядро обязано вернуть этот код, а не додумывать
      значение по умолчанию. Это дефект, а не пользовательская ошибка.
    decided_by: core
  - code: DECIDER_PANIC
    category: INTERNAL
    description: "Файбер обработки команды упал, арена сброшена, нода жива"
    decided_by: core-runtime
  - code: MALFORMED_ENVELOPE
    category: INTERNAL
    description: >
      Конверт SOAP не разобрался: нарушена структура XML, превышен предел
      разборщика или встретился DTD, который ядро отвергает намеренно.
      Снаружи все эти случаи неразличимы — конверт не разобрался, — а
      разница нужна только в логе, поэтому код один. Это дефект оболочки
      или порча на линии, а не пользовательская ошибка.
    decided_by: core-runtime
  - code: INTERNAL_ERROR
    category: INTERNAL
    description: >
      Оболочка не справилась сама: необработанное исключение, отказ базы,
      неизвестный маршрут под /api. Код нужен потому, что ДО НЕГО таких
      ответов не было в контракте вовсе — Spring отдавал свою страницу
      ошибки с полями timestamp/status/error/path, и клиент, разбирающий
      объявленный ApiError, спотыкался ровно там, где нужнее всего понять
      причину.

      Отдельный от INSUFFICIENT_CONTEXT и DECIDER_PANIC: те объявляют
      дефект ЯДРА, а этот — дефект оболочки. Один код на двоих означал бы,
      что по ответу нельзя понять, в какой половине системы искать.
    decided_by: shell
