# The one list of refusal codes.
#
# The source of truth. Generated from this file:
#   * Java   -- enum sonder.contract.ErrorCode
#   * TS     -- the ErrorCode union for the web
#   * Pascal -- constants in src/generated/errcodes.inc
#
# Rules:
#   * a code is never reused and never changes meaning -- only new ones
#     are added;
#   * removing a code is a breaking contract change and a new major
#     version;
#   * the category fixes the HTTP status and the default retryability;
#   * an individual code may override retryability with its own field --
#     it is a property of the code, not only of the category;
#   * message text is not kept here: it lives in the web's wording, and
#     the shell and the core deal in codes alone.
#
# decided_by tells apart three things, not two:
#
#   core          -- returned by the DECISION FUNCTION. Every such code
#                    must have a case in the tstdomn golden set that
#                    produces it; coverage is checked mechanically.
#   core-runtime  -- produced by the core's runtime: envelope parsing, a
#                    fiber crash, a dead arena. Decision functions never
#                    return these, and they have no business in the
#                    golden set.
#   shell         -- decided by the shell.
#
# The distinction exists because without it the rule "every core code has
# a case" cannot be checked at all: two infrastructure codes made it
# false by construction, and it was quietly not held.

version: 1

categories:
  VALIDATION:  { http: 400, retryable: false, description: "The command fails a check of form" }
  AUTH:        { http: 401, retryable: false, description: "Identity could not be established" }
  PERMISSION:  { http: 403, retryable: false, description: "Identity established, action not allowed" }
  NOT_FOUND:   { http: 404, retryable: false, description: "The object does not exist" }
  CONFLICT:    { http: 409, retryable: false, description: "The state does not admit this action" }
  RATE_LIMIT:  { http: 429, retryable: true,  description: "A rate limit was exceeded" }
  UPSTREAM:    { http: 502, retryable: true,  description: "A dependency failed" }
  INTERNAL:    { http: 500, retryable: false, description: "A defect of the system" }

codes:

  # --- VALIDATION -----------------------------------------------------------
  - code: NICK_FORMAT_INVALID
    category: VALIDATION
    description: "The nick does not match [a-z0-9_]{3,20}"
    decided_by: core          # the Pascal core
  - code: POST_BODY_EMPTY
    category: VALIDATION
    description: "The post body is empty or nothing but whitespace"
    decided_by: core
  - code: POST_BODY_TOO_LONG
    category: VALIDATION
    description: "The post body is longer than allowed"
    decided_by: core
  - code: COMMENT_BODY_EMPTY
    category: VALIDATION
    description: "The comment body is empty"
    decided_by: core
  - code: COMMENT_BODY_TOO_LONG
    category: VALIDATION
    description: "The comment body is longer than allowed"
    decided_by: core
  - code: BAN_REASON_EMPTY
    category: VALIDATION
    description: "A ban reason is required: it goes into the audit trail"
    decided_by: core
  - code: BAN_REASON_TOO_LONG
    category: VALIDATION
    description: "The ban reason is longer than allowed"
    decided_by: core
  - code: DISPLAY_NAME_INVALID
    category: VALIDATION
    description: "The display name is empty or longer than allowed"
    decided_by: core
  - code: TEXT_ENCODING_INVALID
    category: VALIDATION
    description: >-
      Free text is not valid UTF-8. The core counts length in characters,
      and a broken sequence cannot be counted, so the refusal comes before
      the length check. Unreachable in normal operation: the bytes are
      produced by Java and the line is guarded by CRC-16.
    decided_by: core

  - code: MALFORMED_REQUEST
    category: VALIDATION
    description: >-
      The request does not match the shape declared in OpenAPI: no body,
      a missing required field, a field of the wrong type.

      Decided by the shell, and this is no overlap with the domain: the
      core checks the MEANING of a command -- text length, permissions,
      rate -- while this is about a command that could not even be
      assembled. A missing request body is not "an invalid display name",
      and answering it with a domain code would tell the user something
      untrue about what they got wrong.
    decided_by: shell

  # --- AUTH -----------------------------------------------------------------
  # Authentication needs storage, and therefore lives wholly in the shell.
  - code: SESSION_INVALID
    category: AUTH
    description: "The session is unknown, expired or revoked"
    decided_by: shell
  - code: CREDENTIALS_INVALID
    category: AUTH
    description: "Wrong name and password"
    decided_by: shell

  # --- PERMISSION -----------------------------------------------------------
  - code: ACTOR_BANNED
    category: PERMISSION
    description: "A banned user creates no content"
    decided_by: core
  - code: NOT_OWNER
    category: PERMISSION
    description: "The action belongs to the owner of the object"
    decided_by: core
  - code: ROLE_INSUFFICIENT
    category: PERMISSION
    description: "The role does not carry the right to this action"
    decided_by: core
  - code: CANNOT_MODERATE_PEER
    category: PERMISSION
    description: "A moderator does not act against an equal or a senior"
    decided_by: core

  # --- NOT_FOUND ------------------------------------------------------------
  - code: USER_NOT_FOUND
    category: NOT_FOUND
    description: "No such user"
    decided_by: core
  - code: POST_NOT_FOUND
    category: NOT_FOUND
    description: "No such post"
    decided_by: core
  - code: RESOURCE_NOT_FOUND
    category: NOT_FOUND
    description: >-
      The requested object is absent or not visible. A separate code from
      POST_NOT_FOUND, because these are DIFFERENT decisions taken by
      different sides.

      POST_NOT_FOUND is the core's, handling a COMMAND: the command refers
      to a post that does not exist or was deleted, and that is a domain
      refusal.

      RESOURCE_NOT_FOUND is the shell's, handling a READ: the core takes
      no part in reading at all -- reading is not deciding. The two codes
      already mean different things (the core answers POST_NOT_FOUND for a
      deleted post as well), and one code for two decisions would mean a
      change in the core quietly altering the behaviour of reads.

      The distinction was found by the ArchUnit gate on the shell's very
      first attempt to borrow a code that was not its own.
    decided_by: shell

  # --- CONFLICT -------------------------------------------------------------
  - code: NICK_TAKEN
    category: CONFLICT
    description: "The nick is already taken"
    decided_by: core
  - code: SELF_FOLLOW
    category: CONFLICT
    description: "One cannot follow oneself"
    decided_by: core
  - code: ALREADY_FOLLOWING
    category: CONFLICT
    description: "The subscription already exists"
    decided_by: core
  - code: NOT_FOLLOWING
    category: CONFLICT
    description: >-
      Nothing to unfollow: there is no subscription. The mirror of
      ALREADY_FOLLOWING, and it appeared together with the UnfollowUser
      operation.

      Unfollowing oneself lands here rather than in SELF_FOLLOW: one
      cannot follow oneself, so a subscription to oneself never exists,
      and "you are not following" is an exact description rather than a
      substitute.
    decided_by: core
  - code: ALREADY_BANNED
    category: CONFLICT
    description: "The user is already banned"
    decided_by: core
  - code: STATE_VERSION_CONFLICT
    category: CONFLICT
    description: "The state changed between load and save; the command must be replayed"
    decided_by: shell
    # The only CONFLICT code that IS retryable, and therefore the only one
    # overriding its category's default.
    #
    # The other conflicts say "your action contradicts reality": the nick
    # is taken, the subscription exists, the user is already banned.
    # Retrying changes nothing there and only spends time.
    #
    # A version conflict is a different animal: it is a lost race. The
    # state moved ahead, and the next attempt -- with a fresh read and a
    # fresh decision from the core -- will most likely go through. Telling
    # the client "409, do not retry" would be advising surrender exactly
    # where another try is what is needed.
    #
    # Found by a test that asserted a property rather than restating the
    # code: the command runner gives up with precisely this code, and
    # retryable is a thing it must be.
    retryable: true

  # --- RATE_LIMIT -----------------------------------------------------------
  - code: POST_RATE_EXCEEDED
    category: RATE_LIMIT
    description: "Too many posts within the window"
    decided_by: core
  - code: COMMENT_RATE_EXCEEDED
    category: RATE_LIMIT
    description: "Too many comments within the window"
    decided_by: core
  - code: LOGIN_RATE_EXCEEDED
    category: RATE_LIMIT
    description: "Too many login attempts"
    decided_by: shell

  # --- UPSTREAM -------------------------------------------------------------
  - code: DECIDER_UNAVAILABLE
    category: UPSTREAM
    description: "The domain core is unreachable or did not answer in time"
    decided_by: shell

  # --- INTERNAL -------------------------------------------------------------
  - code: INSUFFICIENT_CONTEXT
    category: INTERNAL
    description: >
      The core lacked the data to decide: the shell sent less than the
      contract declares. The core must return this code rather than
      invent a default. It is a defect, not a user error.
    decided_by: core
  - code: DECIDER_PANIC
    category: INTERNAL
    description: "The command fiber crashed, the arena was reset, the node lives"
    decided_by: core-runtime
  - code: MALFORMED_ENVELOPE
    category: INTERNAL
    description: >
      The SOAP envelope did not parse: broken XML structure, a parser
      limit exceeded, or a DTD the core refuses on purpose. From outside
      these cases are indistinguishable -- the envelope did not parse --
      and the difference matters only in the log, so there is one code.
      It is a defect of the shell or damage on the line, not a user error.
    decided_by: core-runtime
  - code: INTERNAL_ERROR
    category: INTERNAL
    description: >
      The shell failed on its own: an unhandled exception, a database
      failure, an unknown route under /api. The code exists because
      BEFORE IT such answers were not in the contract at all -- Spring
      served its own error page with timestamp/status/error/path, and a
      client parsing the declared ApiError stumbled exactly where the
      cause matters most.

      Separate from INSUFFICIENT_CONTEXT and DECIDER_PANIC: those declare
      a defect of the CORE, this one a defect of the shell. One code for
      both would mean the answer cannot tell you which half of the system
      to search.
    decided_by: shell
  - code: GATEWAY_UNAVAILABLE
    category: UPSTREAM
    description: >
      The request never reached the shell: it is restarting, crashed, or
      unreachable over the network. The answer comes from the gateway --
      the shell itself is silent, and no `trace_id` exists, because that
      is born there.

      SEPARATE FROM DECIDER_UNAVAILABLE, and the difference is not
      formal: that one means the CORE behind the serial line is not
      answering, this one that the shell is not. One code for both would
      send you looking for the fault in a sixteen-bit program under an
      emulator when in fact Java failed to come up.

      Worth retrying: restarting the shell takes seconds.
    decided_by: shell
