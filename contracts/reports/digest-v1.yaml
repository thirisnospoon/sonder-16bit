# Разметка записи ночного свода.
#
# Источник правды для ДВУХ сторон, которые обязаны совпасть побайтово:
#
#   * копибук COBOL — report/copybook/DIGEST.cpy, разметка чтения;
#   * писатель на Java — сторона выгрузки.
#
# Разойдись они, и программа прочитает мусор, не заметив: у файла
# фиксированной ширины нет ни разделителей, ни заголовков, и сдвиг на
# один байт означает, что всё последующее прочитано неверно, но
# прочитано. Именно поэтому разметка здесь, а не в двух местах руками.
#
# ШИРИНЫ В БАЙТАХ, А НЕ В СИМВОЛАХ, и это не мелочь. Домен объявляет
# длины в символах (ADR-0014): ник — до двадцати БУКВ. COBOL считает
# байты, и двадцать кириллических букв это сорок байт. Ширина каждого
# текстового поля здесь — уже пересчитанная, с явным множителем, чтобы
# при следующем чтении никто не «исправил» её обратно.
#
# ЗАПИСЬ ФИКСИРОВАННОЙ ДЛИНЫ, БЕЗ РАЗДЕЛИТЕЛЕЙ. Так читает COBOL, и так
# файл остаётся понятным без парсера: смещения складываются.

version: 1

# Как читать типы:
#   text  — PIC X(n), выравнивание влево, добивка пробелами
#   num   — PIC 9(n), выравнивание вправо, добивка нулями, без знака
#   date  — PIC 9(8), ГГГГММДД
record:
  name: DigestPost
  description: >-
    Одна строка выгрузки: пост с автором и днём. Свод считает по этим
    строкам, сам их не изменяя.

  fields:
    - name: postId
      type: text
      bytes: 40
      description: >-
        Идентификатор поста. Сорок байт — как в базе (VARCHAR(40)),
        и он всегда ASCII: префикс и шестнадцатеричные цифры.

    - name: authorNick
      type: text
      bytes: 80
      chars: 20
      description: >-
        Ник автора. Двадцать символов домена, до четырёх байт на символ
        в UTF-8 — восемьдесят байт. Ник ограничен латиницей, цифрами и
        подчёркиванием, то есть фактически занимает двадцать; ширина
        взята с запасом на случай снятия этого ограничения, и снятие не
        потребует менять разметку.

    - name: authorDisplayName
      type: text
      bytes: 240
      chars: 60
      description: >-
        Отображаемое имя: шестьдесят символов домена. Здесь кириллица
        обычна, и запас нужен по-настоящему.

    - name: createdDate
      type: date
      bytes: 8
      description: День создания в ГГГГММДД. Времени в своде нет — он суточный.

    - name: bodyBytes
      type: num
      bytes: 6
      description: >-
        Длина тела поста в байтах. Само тело в свод не идёт: свод считает,
        а не цитирует, и тысяча знаков на запись сделала бы файл в
        тридцать раз толще без пользы для итогов.

    - name: bodyChars
      type: num
      bytes: 6
      description: >-
        Длина тела в символах. Отдельно от байтовой намеренно: их
        расхождение и есть мера того, сколько в системе не-латиницы, а
        считать это по одному числу нельзя.

# Итоговая длина записи. Пишется явно и проверяется генератором: сумма
# ширин, посчитанная в уме, однажды разойдётся с суммой, посчитанной
# машиной, и разойдётся молча.
record_bytes: 380

# Признак конца строки в файле. LF, а не CRLF: файл читается в Linux
# GnuCOBOL, и лишний байт сдвинул бы каждую следующую запись.
line_terminator: LF
